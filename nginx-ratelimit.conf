# DataDock – rate-limit zones (must live in the http{} context)
# Install: sudo cp nginx-ratelimit.conf /etc/nginx/conf.d/datadock-ratelimit.conf

# General traffic: 20 req/s per IP, ~1 MB of zone tracks ~16k IPs
limit_req_zone  $binary_remote_addr zone=dd_general:10m rate=20r/s;

# Sensitive endpoints (forms, auth-heavy API): 4 req/s per IP
limit_req_zone  $binary_remote_addr zone=dd_strict:10m  rate=4r/s;

# Max simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=dd_conn:10m;

# Return 429 (not the default 503) when a limit trips
limit_req_status  429;
limit_conn_status 429;
