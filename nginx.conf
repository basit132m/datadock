# DataDock – Nginx virtual-host config
# Drop this file in /etc/nginx/sites-available/datadock and symlink to sites-enabled
# Then: sudo certbot --nginx -d datadock-host.site

server {
    listen 80;
    server_name datadock-host.site www.datadock-host.site;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name datadock-host.site www.datadock-host.site;

    # SSL — filled in by certbot, or replace with your own certs
    ssl_certificate     /etc/letsencrypt/live/datadock-host.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datadock-host.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Frontend & API ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large bodies only for presign/init requests (not actual file data)
        client_max_body_size 1m;

        # Generous timeout for init and complete calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # NOTE: Actual file chunks go from the browser DIRECTLY to Backblaze B2
    # via presigned PUT URLs — they never pass through this nginx.
    # That is why there is no need to increase client_max_body_size here.
}
