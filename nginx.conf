# DataDock – Nginx virtual-host config
# Drop this file in /etc/nginx/sites-available/datadock and symlink to sites-enabled
# Also install nginx-ratelimit.conf into /etc/nginx/conf.d/ (defines the zones used below)
# Then: sudo certbot --nginx -d datadock-host.site

server {
    listen 80;
    server_name datadock-host.site www.datadock-host.site;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name datadock-host.site www.datadock-host.site;

    # SSL — filled in by certbot, or replace with your own certs
    ssl_certificate     /etc/letsencrypt/live/datadock-host.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datadock-host.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # Drop oversized/slow request bodies early (file chunks never pass through here)
    client_max_body_size  1m;
    client_body_timeout   15s;
    client_header_timeout 15s;

    # Cap simultaneous connections per IP (slowloris / connection floods)
    limit_conn dd_conn 30;

    # ── Upload chunks (relay mode): bigger bodies, generous limit ───────────────
    location /api/upload/ {
        limit_req zone=dd_general burst=100 nodelay;
        client_max_body_size 64m;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Sensitive endpoints: tighter rate limit ─────────────────────────────────
    location ~ ^/api/(access-requests|reports|support) {
        limit_req zone=dd_strict burst=8 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Frontend & API ──────────────────────────────────────────────────────────
    location / {
        limit_req zone=dd_general burst=50 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeout for init and complete calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # NOTE: Actual file chunks go from the browser DIRECTLY to Backblaze B2
    # via presigned PUT URLs — they never pass through this nginx.
    # That is why there is no need to increase client_max_body_size here.

    # NOTE: If you put Cloudflare in front (recommended for real DDoS protection),
    # $remote_addr becomes Cloudflare's edge IP. Install the real-IP mapping:
    #   real_ip_header CF-Connecting-IP;  +  set_real_ip_from <CF ranges>;
    # so per-IP limits keep working against the true client address.
}
