<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — DataDock</title>
<meta name="description" content="Live system status and uptime for DataDock.">
<meta name="robots" content="index,follow">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --text:#111827; --muted:#6b7280; --faint:#9ca3af;
    --border:#e5e7eb; --border-strong:#d1d5db;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --nodata:#e5e7eb;
    --accent:#111827;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --panel:#0f141b; --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
      --border:#21262d; --border-strong:#30363d; --nodata:#21262d; --accent:#e6edf3;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
  a{color:inherit}

  /* Header */
  .top{display:flex;align-items:center;gap:.6rem;padding-bottom:2rem}
  .top img{height:24px;width:auto;display:block}
  .top .brand{font-weight:600;font-size:1rem;letter-spacing:-.01em}
  .top .brand .s{color:var(--muted);font-weight:500}
  .top .back{margin-left:auto;font-size:.85rem;color:var(--muted);text-decoration:none}
  .top .back:hover{color:var(--text)}

  /* Overall status */
  .status{display:flex;align-items:center;gap:.7rem;border:1px solid var(--border);
    border-radius:10px;padding:1rem 1.15rem;margin-bottom:1.75rem}
  .status .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--green)}
  .status .dot.degraded{background:var(--amber)}
  .status .dot.down{background:var(--red)}
  .status h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
  .status .upd{margin-left:auto;font-size:.8rem;color:var(--faint);white-space:nowrap}

  /* Uptime summary */
  .summary{display:flex;gap:2.25rem;margin-bottom:2.25rem;padding:0 .15rem;flex-wrap:wrap}
  .summary .item .n{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
  .summary .item .l{font-size:.8rem;color:var(--muted);margin-top:.1rem}

  /* Section */
  .sec{margin-bottom:2.25rem}
  .sec-h{display:flex;align-items:baseline;margin-bottom:.9rem}
  .sec-h h2{margin:0;font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sec-h .r{margin-left:auto;font-size:.82rem;color:var(--muted)}

  /* Services list */
  .svc{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .svc .row{display:flex;align-items:center;gap:.9rem;padding:.9rem 1.1rem;border-top:1px solid var(--border)}
  .svc .row:first-child{border-top:none}
  .svc .nm{font-weight:500;font-size:.92rem}
  .svc .ds{font-size:.8rem;color:var(--faint);margin-top:.05rem}
  .svc .st{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:500;
    color:var(--muted);white-space:nowrap}
  .svc .st .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .svc .st.operational{color:var(--green)}.svc .st.operational .d{background:var(--green)}
  .svc .st.degraded{color:var(--amber)}.svc .st.degraded .d{background:var(--amber)}
  .svc .st.down{color:var(--red)}.svc .st.down .d{background:var(--red)}

  /* Uptime bars */
  .bars{display:flex;gap:2px;align-items:stretch;height:34px}
  .bar{flex:1 1 0;min-width:0;border-radius:2px;background:var(--nodata)}
  .bar.op{background:var(--green)}.bar.part{background:var(--amber)}.bar.down{background:var(--red)}
  .axis{display:flex;justify-content:space-between;color:var(--faint);font-size:.76rem;margin-top:.5rem}

  .foot{color:var(--faint);font-size:.8rem;border-top:1px solid var(--border);padding-top:1.25rem;margin-top:.5rem;
    display:flex;gap:.9rem;flex-wrap:wrap;align-items:center}
  .foot a{color:var(--muted);text-decoration:none}
  .foot a:hover{color:var(--text)}
  .foot .sp{flex:1}
  .loading{color:var(--muted);padding:3rem 0;text-align:center;font-size:.9rem}

  .tip{position:fixed;background:var(--accent);color:var(--bg);font-size:.75rem;font-weight:500;padding:.35rem .55rem;
    border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:20;white-space:nowrap;
    transform:translate(-50%,-125%)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="/logo.webp" alt="DataDock" onerror="this.style.display='none'">
    <a class="back" href="/">Back to site</a>
  </div>

  <div id="content">
    <div class="loading">Loading status…</div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

function fmtPct(p){ return p == null ? '—' : (Number.isInteger(p) ? p + '%' : p.toFixed(p >= 99 ? 2 : 1) + '%'); }
function fmtDate(iso){ try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); } catch { return iso; } }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const OVERALL = {
  operational: 'All systems operational',
  degraded:    'Partial degradation',
  down:        'Major outage',
};
const CLABEL = { operational:'Operational', degraded:'Degraded', down:'Down' };

let shellBuilt = false;
let lastUpdated = null;

function buildShell(d){
  $('content').innerHTML = `
    <div class="status">
      <span class="dot" id="ov-dot"></span>
      <h1 id="ov-title">—</h1>
      <span class="upd" id="ov-upd"></span>
    </div>

    <div class="summary">
      <div class="item"><div class="n" id="u90">—</div><div class="l">Uptime · 90 days</div></div>
      <div class="item"><div class="n" id="u30">—</div><div class="l">Uptime · 30 days</div></div>
      <div class="item"><div class="n" id="svc">—</div><div class="l">Services operational</div></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>Services</h2></div>
      <div class="svc" id="comp-list"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>Uptime — last 90 days</h2><span class="r" id="bars-pct">—</span></div>
      <div class="bars" id="bars"></div>
      <div class="axis"><span>90 days ago</span><span>Today</span></div>
    </div>

    <div class="foot">
      <span id="foot-since"></span>
      <span class="sp"></span>
      <span id="foot-checked">Updating…</span>
      <a href="/api/status" target="_blank" rel="noopener">API</a>
    </div>`;

  $('comp-list').innerHTML = d.components.map((c, i) => `
    <div class="row">
      <div>
        <div class="nm">${esc(c.name)}</div>
        <div class="ds">${esc(c.desc || '')}</div>
      </div>
      <div class="st" id="st-${i}"><span class="d"></span><span id="clabel-${i}"></span></div>
    </div>`).join('');

  $('bars').innerHTML = d.daily.map((_, i) => `<div class="bar" id="bar-${i}" data-tip=""></div>`).join('');
  wireTips();
  shellBuilt = true;
}

function barClass(day){
  if (!day.monitored || day.uptime == null) return '';
  if (day.uptime >= 99.9) return 'op';
  if (day.uptime >= 90)   return 'part';
  return 'down';
}
function barTip(day){
  if (!day.monitored || day.uptime == null) return fmtDate(day.date) + ' · no data';
  const base = fmtDate(day.date) + ' · ' + fmtPct(day.uptime) + ' up';
  return day.down_minutes ? base + ' (' + day.down_minutes + 'm down)' : base;
}
function setText(el, txt){ if (el && el.textContent !== txt){ el.textContent = txt; return true; } return false; }

function apply(d){
  if (!shellBuilt) buildShell(d);

  $('ov-dot').className = 'dot ' + (d.overall || 'operational');
  setText($('ov-title'), OVERALL[d.overall] || OVERALL.operational);

  setText($('u90'), fmtPct(d.uptime_90d));
  setText($('u30'), fmtPct(d.uptime_30d));
  setText($('bars-pct'), fmtPct(d.uptime_90d) + ' uptime');

  const ok = d.components.filter(c => c.status === 'operational').length;
  setText($('svc'), ok + ' / ' + d.components.length);

  d.components.forEach((c, i) => {
    const st = $('st-' + i), lb = $('clabel-' + i);
    if (st) st.className = 'st ' + c.status;
    setText(lb, CLABEL[c.status] || c.status);
  });

  d.daily.forEach((day, i) => {
    const b = $('bar-' + i);
    if (!b) return;
    const cls = barClass(day);
    b.className = 'bar' + (cls ? ' ' + cls : '');
    b.dataset.tip = barTip(day);
  });

  $('foot-since').textContent = d.monitoring_since ? ('Monitoring since ' + fmtDate(d.monitoring_since)) : 'Monitoring just started';
  lastUpdated = new Date();
  tickAgo();
}

async function poll(){
  try {
    const d = await fetch('/api/status', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject());
    apply(d);
  } catch {
    if (!shellBuilt) $('content').innerHTML = '<div class="loading">Could not load status. Retrying…</div>';
  }
}

function tickAgo(){
  if (!lastUpdated) return;
  const secs = Math.max(0, Math.round((Date.now() - lastUpdated.getTime()) / 1000));
  const ago = secs < 5 ? 'just now' : secs < 60 ? secs + 's ago' : Math.round(secs/60) + 'm ago';
  const txt = 'Updated ' + ago;
  const upd = $('ov-upd'), fc = $('foot-checked');
  if (upd) upd.textContent = txt;
  if (fc) fc.textContent = txt;
}

function wireTips(){
  const tip = $('tip'), bars = $('bars');
  const show = e => {
    const b = e.target.closest('.bar'); if (!b) return;
    tip.textContent = b.dataset.tip;
    const r = b.getBoundingClientRect();
    tip.style.left = (r.left + r.width/2) + 'px';
    tip.style.top = r.top + 'px';
    tip.style.opacity = '1';
  };
  bars.addEventListener('mouseover', show);
  bars.addEventListener('mousemove', show);
  bars.addEventListener('mouseout', () => { tip.style.opacity = '0'; });
}

poll();
setInterval(poll, 15000);
setInterval(tickAgo, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
