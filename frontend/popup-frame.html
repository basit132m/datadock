<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title></title></head>
<body style="margin:0;height:100vh;width:100vw;background:transparent;cursor:pointer;overflow:hidden">
<script>
// Isolated frame for the pop-up ad script. Same-origin as the parent, so the ad
// tag runs with a real hostname/referrer. Parent injects the tag via postMessage;
// we tell the parent when the frame is clicked (so it can remove the overlay).
(function () {
  var injected = false;
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.__ddpopup !== 'inject' || !e.data.html) return;
    if (injected) return; injected = true;
    try {
      var tmp = document.createElement('div');
      tmp.innerHTML = e.data.html;
      tmp.querySelectorAll('script').forEach(function (orig) {
        var s = document.createElement('script');
        for (var i = 0; i < orig.attributes.length; i++) { var a = orig.attributes[i]; s.setAttribute(a.name, a.value); }
        if (orig.src) { s.src = orig.src; s.async = true; } else { s.textContent = orig.textContent; }
        document.body.appendChild(s);
      });
    } catch (_) {}
  }, false);
  document.addEventListener('click', function () {
    try { parent.postMessage({ __ddpopup: 'fired' }, location.origin); } catch (_) {}
  }, false);
  try { parent.postMessage({ __ddpopup: 'ready' }, location.origin); } catch (_) {}
})();
</script>
</body>
</html>
