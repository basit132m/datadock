version: "3.9"

services:
  datadock:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - ./data:/app/backend/data
    environment:
      DATABASE_URL: sqlite:////app/backend/data/datadock.db
      GEOIP_DB_PATH: /app/backend/data/GeoLite2-Country.mmdb
      # Import-from-URL tuning — increase after VPS upgrade for faster imports
      IMPORT_WORKERS: "8"       # parallel R2 upload threads (4 = default, 8 = recommended on 2+ core VPS)
      IMPORT_CHUNK_MB: "32"     # MB per multipart chunk (32 is optimal for R2)
      IMPORT_QUEUE_MAX: "16"    # max chunks buffered in memory at once
      IMPORT_READ_MB: "4"       # HTTP read buffer size in MB
    ports:
      - "127.0.0.1:8000:8000"   # only expose to localhost; nginx proxies externally
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
