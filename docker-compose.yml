version: "3.9"

services:
  datadock:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - ./data:/app/backend/data
    environment:
      DATABASE_URL: sqlite:////app/backend/data/datadock.db
      GEOIP_DB_PATH: /app/backend/data/GeoLite2-Country.mmdb
      # Import-from-URL tuning — tuned for KVM 2 (2 cores, 8 GB RAM)
      IMPORT_WORKERS: "16"      # parallel R2 upload threads
      IMPORT_CHUNK_MB: "64"     # MB per multipart chunk (64 MB = fewer R2 API calls, faster for large files)
      IMPORT_QUEUE_MAX: "24"    # max chunks buffered in memory (24 × 64 MB = 1.5 GB max, safe on 8 GB RAM)
      IMPORT_READ_MB: "8"       # HTTP read buffer size in MB
    ports:
      - "127.0.0.1:8000:8000"   # only expose to localhost; nginx proxies externally
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
